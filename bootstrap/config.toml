# Конфигурация Arachnid Client.
#
# Клиент открывает официальный веб-клиент Stoat, как Stoat for Desktop.
# Вход, сессия и настройки веб-клиента хранятся в папке webview\ рядом.

[instance]
# Адрес веб-клиента, который открывается в окне.
# Свой инстанс: адрес его веб-клиента, например "https://stoat.example.com".
# Нужен https (http — только для localhost).
app_url = "https://stoat.chat/app"

[memory]
# Экономия памяти (Windows, WebView2): пока окно свёрнуто или спрятано в трей,
# через 20 секунд веб-клиент отдаёт системе кэши. Сообщения, уведомления и
# звонки продолжают работать, страница не перезагружается.
background = true
# То же, когда окно 2 минуты без фокуса (по умолчанию выключено).
unfocused = false
