name = "Переводчик"
version = "1.1.0"
author = "_sssHpion007"
description = "Перевод сообщений кнопкой в панели сообщения и пунктом меню"

[permissions]
network = [
  "translate-pa.googleapis.com",
  "edge.microsoft.com",
  "api-free.deepl.com",
  "api.deepl.com",
]

[[settings]]
name = "service"
label = "Сервис перевода"
type = "select"
default = "google"
options = [
  { value = "google", label = "Google Переводчик" },
  { value = "microsoft", label = "Microsoft Translator" },
  { value = "deepl", label = "DeepL (нужен ключ API)" },
]

