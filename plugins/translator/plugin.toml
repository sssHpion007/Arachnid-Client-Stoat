name = "Translator"
version = "1.2.0"
author = "_sssHpion007"
description = "Translates messages with a button in the message toolbar and a context menu item"
icon = "icon.svg"

[permissions]
network = [
  "translate-pa.googleapis.com",
  "edge.microsoft.com",
  "api-free.deepl.com",
  "api.deepl.com",
]

[[settings]]
name = "service"
label = "Translation Service"
hint = "Where message text is sent for translation."
type = "select"
default = "google"
options = [
  { value = "google", label = "Google Translate" },
  { value = "microsoft", label = "Microsoft Translator" },
  { value = "deepl", label = "DeepL (API key required)" },
]

[[settings]]
name = "language"
label = "Target Language"
hint = "“Same as Client” follows the Stoat interface language."
type = "select"
default = "auto"
options = [
  { value = "auto", label = "Same as Client" },
  { value = "en", label = "English" },
  { value = "ru", label = "Русский" },
  { value = "uk", label = "Українська" },
