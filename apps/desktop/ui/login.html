<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="Arachnid Client — log in">Arachnid Client — вход</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="fonts-extra.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="titlebar.css" />
    <script src="vendor/material-color.js"></script>
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true">S</div>
        <div>
          <h1 data-i18n="Log in to Stoat">Вход в Stoat</h1>
          <div class="sub">Arachnid Client · <span id="instance-name">stoat.chat</span></div>
        </div>
      </div>

      <!-- Шаг 1: почта и пароль -->
      <form id="form-password" autocomplete="on">
        <label for="email" data-i18n="Email">Почта</label>
        <input id="email" type="email" name="email" autocomplete="username"
               placeholder="you@example.com" required />

        <label for="password" data-i18n="Password">Пароль</label>
        <input id="password" type="password" name="password" autocomplete="current-password"
               placeholder="••••••••" required />

        <div class="checkbox">
          <input id="remember" type="checkbox" checked />
          <label for="remember" data-i18n="Remember the session on this device">Запомнить сессию на этом устройстве</label>
        </div>

        <button class="primary" type="submit" id="submit-password" data-i18n="Log in">Войти</button>
      </form>

      <!-- Шаг 2: второй фактор -->
      <form id="form-mfa" class="hidden" autocomplete="off">
        <label for="mfa-value" id="mfa-label" data-i18n="Verification code">Код подтверждения</label>
        <input id="mfa-value" type="text" inputmode="numeric" autocomplete="one-time-code"
               placeholder="000000" />
        <div class="mfa-hint" id="mfa-hint"></div>
        <button class="primary" type="submit" id="submit-mfa" data-i18n="Confirm">Подтвердить</button>
        <div class="row">
          <button class="text" type="button" id="mfa-back" data-i18n="Back">Назад</button>
        </div>
      </form>

      <div class="msg" id="msg"></div>

      <div class="footer">
        <details>
          <summary data-i18n="Log in with a session token (for developers)">Войти по токену сессии (для разработчиков)</summary>
          <div class="inner">
            <label for="token" data-i18n="Token (Stoat → Settings → Sessions)">Токен (Stoat → Настройки → Сессии)</label>
            <input id="token" type="password" placeholder="вставьте токен" data-i18n-placeholder="paste the token" autocomplete="off" />
            <button class="primary" type="button" id="submit-token" data-i18n="Log in with token">Войти с токеном</button>
          </div>
        </details>
      </div>

      <div class="instance" id="instance-info" data-i18n="instance: checking…">инстанс: проверяю…</div>
    </div>

    <script src="icons.js"></script>
    <script src="titlebar.js"></script>
    <script src="login.js" defer></script>
  </body>
</html>
