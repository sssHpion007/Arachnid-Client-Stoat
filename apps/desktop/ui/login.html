<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arachnid Client — вход</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true">S</div>
        <div>
          <h1>Вход в Stoat</h1>
          <div class="sub">Arachnid Client · <span id="instance-name">stoat.chat</span></div>
        </div>
      </div>

      <!-- Шаг 1: почта и пароль -->
      <form id="form-password" autocomplete="on">
        <label for="email">Почта</label>
        <input id="email" type="email" name="email" autocomplete="username"
               placeholder="you@example.com" required />

        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" autocomplete="current-password"
               placeholder="••••••••" required />

        <div class="checkbox">
          <input id="remember" type="checkbox" checked />
          <label for="remember">Запомнить сессию на этом устройстве</label>
        </div>

        <button class="primary" type="submit" id="submit-password">Войти</button>
      </form>

      <!-- Шаг 2: второй фактор -->
      <form id="form-mfa" class="hidden" autocomplete="off">
        <label for="mfa-value" id="mfa-label">Код подтверждения</label>
        <input id="mfa-value" type="text" inputmode="numeric" autocomplete="one-time-code"
               placeholder="000000" />
        <div class="mfa-hint" id="mfa-hint"></div>
        <button class="primary" type="submit" id="submit-mfa">Подтвердить</button>
        <div class="row">
          <button class="text" type="button" id="mfa-back">Назад</button>
        </div>
      </form>

      <div class="msg" id="msg"></div>

      <div class="footer">
        <details>
          <summary>Войти по токену сессии (для разработчиков)</summary>
          <div class="inner">
            <label for="token">Токен (Stoat → Настройки → Сессии)</label>
            <input id="token" type="password" placeholder="вставьте токен" autocomplete="off" />
            <button class="primary" type="button" id="submit-token">Войти с токеном</button>
          </div>
        </details>
      </div>

      <div class="instance" id="instance-info">инстанс: проверяю…</div>
    </div>

    <script src="login.js" defer></script>
  </body>
</html>
