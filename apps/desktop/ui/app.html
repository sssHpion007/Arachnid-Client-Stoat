<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri-Stoat</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- рельс серверов -->
      <nav class="rail" id="rail">
        <div class="rail-list" id="rail-list"></div>
        <button class="rail-btn" id="rail-me" title="Аккаунт"></button>
      </nav>

      <!-- список каналов -->
      <aside class="sidebar">
        <header class="sidebar-head">
          <div class="sidebar-title" id="server-name">Загрузка…</div>
          <div class="sidebar-actions">
            <button class="icon-btn" id="btn-refresh" title="Обновить">⟳</button>
          </div>
        </header>
        <div class="channels" id="channels"></div>
        <footer class="me-bar" id="me-bar">
          <div class="avatar" id="me-avatar"></div>
          <div class="me-text">
            <div class="me-name" id="me-name">…</div>
            <div class="me-status" id="me-status">подключаюсь…</div>
          </div>
          <button class="icon-btn" id="btn-logout" title="Выйти">⎋</button>
        </footer>
      </aside>

      <!-- чат -->
      <main class="chat">
        <header class="chat-head">
          <div class="chat-hash" id="chat-hash">#</div>
          <div>
            <div class="chat-title" id="chat-title">Выберите канал</div>
            <div class="chat-sub" id="chat-sub"></div>
          </div>
          <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">не подключено</span></div>
        </header>

        <div class="messages" id="messages">
          <div class="empty" id="empty">
            <div class="empty-icon">💬</div>
            <div class="empty-title">Здесь пока пусто</div>
            <div class="empty-text">Выберите канал слева, чтобы прочитать сообщения</div>
          </div>
        </div>

        <footer class="composer" id="composer">
          <div class="composer-row">
            <input id="input" type="text" placeholder="Выберите канал" disabled
                   autocomplete="off" maxlength="2000" />
            <button class="emoji-btn" id="btn-emoji" type="button" title="Эмодзи сервера">☺</button>
            <button class="send" id="btn-send" disabled title="Отправить">➤</button>
          </div>
          <div class="emoji-picker hidden" id="emoji-picker">
            <input id="emoji-search" type="text" placeholder="Поиск эмодзи" autocomplete="off" />
            <div class="emoji-list" id="emoji-list"></div>
          </div>
          <div class="composer-hint" id="composer-hint"></div>
        </footer>
      </main>
    </div>

    <!-- меню аккаунта -->
    <div class="menu hidden" id="account-menu">
      <div class="menu-title" id="menu-name">…</div>
      <div class="menu-sub" id="menu-id"></div>
      <button class="menu-item" id="menu-switch">Сменить аккаунт</button>
      <button class="menu-item danger" id="menu-logout">Выйти</button>
    </div>

    <div class="toast hidden" id="toast"></div>

    <script src="emoji/map.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
