<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arachnid Client</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="fonts-extra.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="vendor/material-color.js"></script>
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Маски «дырок» в аватарах, как в официальном клиенте (Masks.tsx):
         под значок статуса и под счётчик непрочитанного. -->
    <svg class="masks" aria-hidden="true" width="0" height="0">
      <defs>
        <mask id="mask-avatar" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse"
              x="0" y="0" width="32" height="32">
          <circle cx="16" cy="16" r="16" fill="#fff" />
        </mask>
        <mask id="mask-status" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse"
              x="0" y="0" width="32" height="32">
          <circle cx="16" cy="16" r="16" fill="#fff" />
          <circle cx="27" cy="27" r="7" fill="#000" />
        </mask>
        <mask id="mask-badge" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse"
              x="0" y="0" width="32" height="32">
          <circle cx="16" cy="16" r="16" fill="#fff" />
          <circle cx="27" cy="5" r="7" fill="#000" />
        </mask>
        <mask id="mask-status-badge" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse"
              x="0" y="0" width="32" height="32">
          <circle cx="16" cy="16" r="16" fill="#fff" />
          <circle cx="27" cy="27" r="7" fill="#000" />
          <circle cx="27" cy="5" r="7" fill="#000" />
        </mask>
      </defs>
    </svg>

    <div class="layout" id="layout">
      <!-- рельс серверов -->
      <nav class="server-list" id="server-list" aria-label="Servers">
        <div class="server-list-scroll" id="rail"></div>
        <div class="server-list-bottom" id="rail-bottom"></div>
      </nav>

      <div class="workspace">
        <!-- список каналов / бесед -->
        <aside class="sidebar" id="sidebar">
          <header class="sidebar-header" id="sidebar-header"></header>
          <div class="sidebar-scroll" id="channels"></div>
        </aside>

        <div class="content">
          <!-- шапка канала -->
          <header class="channel-header" id="channel-header">
            <span class="channel-header-icon" id="chat-icon"></span>
            <span class="channel-header-title" id="chat-title">Arachnid Client</span>
            <span class="channel-header-divider hidden" id="chat-divider"></span>
            <span class="channel-header-description" id="chat-sub"></span>
            <span class="spacer"></span>
            <span class="connection" id="conn" title="Соединение со Stoat" data-i18n-title="Stoat connection">
              <span class="connection-dot"></span><span id="conn-text" data-i18n="not connected">не подключено</span>
            </span>
            <button class="icon-button hidden" id="btn-members" type="button" title="Участники" data-i18n-title="Members"></button>
          </header>

          <div class="channel-body">
            <main class="main" id="main">
              <div class="messages" id="messages"></div>

              <div class="composition" id="composition">
                <div class="typing hidden" id="typing"></div>
                <div class="replies" id="replies"></div>
                <div class="message-box hidden" id="message-box">
                  <textarea id="input" rows="1" maxlength="2000"
                            autocomplete="off" placeholder=""></textarea>
                  <button class="icon-button" id="btn-emoji" type="button" title="Эмодзи" data-i18n-title="Emojis"></button>
                  <button class="icon-button send" id="btn-send" type="button" title="Отправить" data-i18n-title="Send"></button>
                </div>
                <div class="blocked hidden" id="blocked"></div>

                <div class="emoji-picker hidden" id="emoji-picker">
                  <input id="emoji-search" type="search" placeholder="Поиск эмодзи" data-i18n-placeholder="Search for emojis..." autocomplete="off" />
                  <div class="emoji-body">
                    <div class="emoji-servers" id="emoji-servers"></div>
                    <div class="emoji-scroll" id="emoji-scroll">
                      <div class="emoji-list" id="emoji-list"></div>
                    </div>
                  </div>
                  <div class="emoji-preview" id="emoji-preview">
                    <span class="emoji-preview-img" id="emoji-preview-img"></span>
                    <span class="emoji-preview-text">
                      <b id="emoji-preview-name"></b>
                      <small id="emoji-preview-from"></small>
                    </span>
                  </div>
                </div>
              </div>
            </main>

            <!-- участники -->
            <aside class="member-sidebar hidden" id="members"></aside>
          </div>
        </div>
      </div>
    </div>

    <!-- меню своего аватара (UserMenu) -->
    <div class="menu account-menu hidden" id="account-menu" role="menu"></div>

    <!-- карточка профиля (UserCard) -->
    <div class="user-card hidden" id="user-card"></div>

    <!-- контекстное меню -->
    <div class="menu context-menu hidden" id="ctx-menu" role="menu"></div>

    <!-- настройки пользователя и сервера -->
    <div class="settings hidden" id="settings" role="dialog" aria-modal="true"></div>

    <!-- модальные окна -->
    <div class="modal-backdrop hidden" id="modal"></div>

    <div class="toast hidden" id="toast" role="status"></div>

    <script src="icons.js"></script>
    <script src="emoji/map.js"></script>
    <script src="titlebar.js"></script>
    <script src="options.js" defer></script>
    <script src="cropper.js" defer></script>
    <script src="profile.js" defer></script>
    <script src="settings.js" defer></script>
    <script src="settings-profile.js" defer></script>
    <script src="settings-client.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
