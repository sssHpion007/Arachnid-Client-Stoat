[package]
name = "arachnid-client"
description = "Клиент Stoat: Tauri-оболочка поверх stoat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "arachnid-client"

[lib]
name = "arachnid_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stoat-core = { path = "../../../crates/stoat-core" }
revolt-models.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
# прокси медиа: аватары и вложения скачивает Rust, а не webview
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# адрес файла в пути запроса протокола media:
percent-encoding = "2"
# QR-код для приложения аутентификации — только SVG, без растровых зависимостей
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[[bin]]
name = "arachnid-client"
path = "src/main.rs"

