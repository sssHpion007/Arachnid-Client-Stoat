[package]
name = "arachnid-client"
description = "Arachnid Client: настольная оболочка Tauri для официального веб-клиента Stoat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "arachnid-client"

[lib]
name = "arachnid_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# раздел «ПК»: запуск вместе с системой
tauri-plugin-autostart = "2"
# второй запуск показывает уже открытое окно (оно может прятаться в трее)
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
# адрес веб-клиента из config.toml
url.workspace = true
toml = "1"
# ссылки из веб-клиента — в системном браузере
open = "5"
# «Discord RPC» в разделе «ПК», как в Stoat for Desktop
discord-rich-presence = "1"
# секции regexp() в @-moz-document тем UserCSS
regex = "1"
# картинки наборов эмодзи сжаты Brotli (src/emoji_packs.rs)
brotli-decompressor = "5"
# эмодзи из системного шрифта Segoe UI Emoji (src/system_emoji.rs): слои
# глифов COLR и контуры — read-fonts, последовательность кодовых точек →
# глиф — harfrust (на том же read-fonts)
read-fonts = "0.47"
harfrust = "0.16"
# картинки эмодзи отдаются странице растром (src/emoji_raster.rs): SVG наборов
# рисует resvg, слои системного шрифта — tiny-skia из того же resvg. Без
# текста, системных шрифтов и растровых форматов кроме PNG
resvg = { version = "0.50", default-features = false }
# нативная часть плагинов — модули WebAssembly в песочнице (src/plugin_host.rs):
# интерпретатор на чистом Rust, без JIT и без доступа модуля к системе
wasmi = { version = "1.1", default-features = false, features = ["std"] }

[dev-dependencies]
# модули WebAssembly для тестов пишутся текстом (WAT)
wat = "1.239"

# экономия памяти в фоне: ICoreWebView2_19::MemoryUsageTargetLevel (те же
# версии, что у Tauri и wry)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# чёткие значки окна и трея из ресурса exe (те же версии, что у Tauri)
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "arachnid-client"
path = "src/main.rs"

