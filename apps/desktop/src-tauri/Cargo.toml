[package]
name = "arachnid-client"
description = "Arachnid Client: настольная оболочка Tauri для официального веб-клиента Stoat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "arachnid-client"

[lib]
name = "arachnid_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# раздел «ПК»: запуск вместе с системой
tauri-plugin-autostart = "2"
# второй запуск показывает уже открытое окно (оно может прятаться в трее)
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
# адрес веб-клиента из config.toml
url.workspace = true
toml = "1"
# ссылки из веб-клиента — в системном браузере
open = "5"
# «Discord RPC» в разделе «ПК», как в Stoat for Desktop
discord-rich-presence = "1"
# секции regexp() в @-moz-document тем UserCSS
regex = "1"

# экономия памяти в фоне: ICoreWebView2_19::MemoryUsageTargetLevel (те же
# версии, что у Tauri и wry)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[[bin]]
name = "arachnid-client"
path = "src/main.rs"

