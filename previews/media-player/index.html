<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Превью: свой видео- и аудиоплеер</title>
    <link rel="stylesheet" href="player.css" />
    <style>
      :root {
        color-scheme: dark;
        --md-sys-color-primary: #b9c3ff;
        --md-sys-color-on-primary: #202c61;
        --md-sys-color-primary-container: #384379;
        --md-sys-color-on-primary-container: #dde1ff;
        --md-sys-color-secondary-container: #424659;
        --md-sys-color-on-secondary-container: #dfe1f9;
        --md-sys-color-surface: #121318;
        --md-sys-color-surface-container-lowest: #0d0e13;
        --md-sys-color-surface-container-low: #1b1b21;
        --md-sys-color-surface-container: #1f1f25;
        --md-sys-color-surface-container-high: #292a2f;
        --md-sys-color-surface-container-highest: #34343a;
        --md-sys-color-on-surface: #e3e1e9;
        --md-sys-color-on-surface-variant: #c6c5d0;
        --md-sys-color-outline: #90909a;
        --md-sys-color-outline-variant: #45464f;
        --md-sys-color-inverse-surface: #e3e1e9;
        --md-sys-color-inverse-on-surface: #303036;
        --md-sys-color-error: #ffb4ab;
        --ap-font: Inter, "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        background: var(--md-sys-color-surface-container-lowest);
        color: var(--md-sys-color-on-surface);
        font: 15px/1.4 var(--ap-font);
      }

      .rail {
        width: 72px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 12px 0;
      }

      .rail i {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--md-sys-color-surface-container-high);
      }

      .rail i:first-child {
        border-radius: 14px;
        background: var(--md-sys-color-primary-container);
      }

      .chat {
        flex: 1;
        min-width: 0;
        margin: 8px 8px 8px 0;
        border-radius: 16px;
        background: var(--md-sys-color-surface-container-low);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
        font-weight: 600;
      }

      header .hash {
        color: var(--md-sys-color-outline);
        font-size: 20px;
      }

      .switch {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 400;
        font-size: 13px;
        color: var(--md-sys-color-on-surface-variant);
        cursor: pointer;
        user-select: none;
      }

      .switch input {
        appearance: none;
        width: 44px;
        height: 24px;
        margin: 0;
        border-radius: 12px;
        border: 2px solid var(--md-sys-color-outline);
        background: var(--md-sys-color-surface-container-highest);
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
      }

      .switch input::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--md-sys-color-outline);
        transition: all 0.15s;
      }

      .switch input:checked {
        border-color: var(--md-sys-color-primary);
        background: var(--md-sys-color-primary);
      }

      .switch input:checked::after {
        left: 22px;
        top: 2px;
        width: 16px;
        height: 16px;
        background: var(--md-sys-color-on-primary);
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px 0 24px;
      }

      .message {
        display: flex;
        gap: 14px;
        padding: 6px 16px;
      }

      .message:hover {
        background: var(--md-sys-color-surface-container);
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-weight: 700;
        color: var(--md-sys-color-on-primary-container);
        background: var(--md-sys-color-primary-container);
      }

      .avatar.b {
        background: #5b3f5e;
        color: #ffd6f9;
      }

      .avatar.c {
        background: #2f4f3c;
        color: #c3eccf;
      }

      .body {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .meta b {
        margin-right: 8px;
      }

      .meta small {
        color: var(--md-sys-color-outline);
        font-size: 12px;
      }

      /* SizedContent из for-web */
      .sized {
        display: grid;
        grid-template: 1fr / 1fr;
        max-width: 100%;
        height: auto;
        overflow: hidden;
        border-radius: 8px;
      }

      .sized > * {
        grid-area: 1 / 1 / 2 / 2;
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
      }

      .sized video {
        background: #000;
      }

      /* AttachmentContainer + FileInfo из for-web */
      .attachment {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-self: start;
        width: 420px;
        max-width: 100%;
        padding: 8px;
        border-radius: 8px;
        overflow: hidden;
        color: var(--md-sys-color-on-secondary-container);
        background: var(--md-sys-color-secondary-container);
      }

      .attachment audio {
        width: 100%;
      }

      .file-info {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .file-info > svg {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        fill: currentColor;
      }

      .file-info .names {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .file-info .names > * {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-info small {
        font-size: 12px;
        opacity: 0.8;
      }

      .icon-button {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: none;
        color: inherit;
        cursor: pointer;
      }

      .icon-button:hover {
        background: color-mix(in srgb, currentColor 10%, transparent);
      }

      .icon-button svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(0 0 0 / 0.8);
        cursor: zoom-out;
        z-index: 10;
      }

      .lightbox img {
        max-width: 80vw;
        max-height: 80vh;
        border-radius: 8px;
      }

      .lightbox[hidden] {
        display: none;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--md-sys-color-inverse-surface);
        color: var(--md-sys-color-inverse-on-surface);
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <nav class="rail"><i></i><i></i><i></i><i></i></nav>
    <main class="chat">
      <header>
        <span class="hash">#</span> медиа
        <label class="switch">
          Свой видео- и аудиоплеер
          <input type="checkbox" id="enabled" checked />
        </label>
      </header>
      <section class="messages">
        <article class="message">
          <div class="avatar">A</div>
          <div class="body">
            <div class="meta"><b>Arachnid</b><small>Сегодня в 14:02</small></div>
            <div>Big Buck Bunny (© Blender Foundation, CC BY 3.0)</div>
            <div class="sized" style="width: 420px; aspect-ratio: 640 / 360">
              <video playsinline preload="metadata" controls src="big-buck-bunny.mp4"></video>
            </div>
          </div>
        </article>

        <article class="message">
          <div class="avatar b">S</div>
          <div class="body">
            <div class="meta"><b>Stoat</b><small>Сегодня в 14:05</small></div>
            <div>Аудио с обложкой внутри файла — щёлкни по обложке.</div>
            <div class="attachment">
              <div class="file-info">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 2C6.486 2 2 6.486 2 12v4.143C2 17.167 2.897 18 4 18h1a1 1 0 0 0 1-1v-5.143a1 1 0 0 0-1-1h-.908C4.648 6.987 7.978 4 12 4s7.352 2.987 7.908 6.857H19a1 1 0 0 0-1 1V18c0 1.103-.897 2-2 2h-2v-1h-4v3h6c2.206 0 4-1.794 4-4 1.103 0 2-.833 2-1.857V12c0-5.514-4.486-10-10-10z"
                  />
                </svg>
                <div class="names"><span>night-city.mp3</span><small>662.94 KB</small></div>
                <button class="icon-button" type="button" data-download="night-city.mp3"></button>
              </div>
              <audio controls src="night-city.mp3"></audio>
            </div>
          </div>
        </article>

        <article class="message">
          <div class="avatar c">M</div>
          <div class="body">
            <div class="meta"><b>Mira</b><small>Сегодня в 14:07</small></div>
            <div>А в этом файле картинки нет.</div>
            <div class="attachment">
              <div class="file-info">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 2C6.486 2 2 6.486 2 12v4.143C2 17.167 2.897 18 4 18h1a1 1 0 0 0 1-1v-5.143a1 1 0 0 0-1-1h-.908C4.648 6.987 7.978 4 12 4s7.352 2.987 7.908 6.857H19a1 1 0 0 0-1 1V18c0 1.103-.897 2-2 2h-2v-1h-4v3h6c2.206 0 4-1.794 4-4 1.103 0 2-.833 2-1.857V12c0-5.514-4.486-10-10-10z"
                  />
                </svg>
                <div class="names"><span>morning.mp3</span><small>313.94 KB</small></div>
                <button class="icon-button" type="button" data-download="morning.mp3"></button>
              </div>
              <audio controls src="morning.mp3"></audio>
            </div>
          </div>
        </article>
      </section>
    </main>

    <div class="lightbox" hidden><img alt="" /></div>
    <div class="toast"></div>

    <script src="icons.js"></script>
    <script src="covers.js"></script>
    <script src="player.js"></script>
    <script>
      "use strict";

      // кнопки «скачать» for-web
      for (const button of document.querySelectorAll("[data-download]")) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 -960 960 960");
        svg.innerHTML = `<path d="${ICONS.download}"/>`;
        button.append(svg);
        button.addEventListener("click", () => download(button.dataset.download));
      }

      function download(url) {
        const link = document.createElement("a");
        link.href = url;
        link.download = url.split("/").pop();
        document.body.append(link);
        link.click();
        link.remove();
      }

      const lightbox = document.querySelector(".lightbox");
      lightbox.addEventListener("click", () => (lightbox.hidden = true));
      document.addEventListener("keydown", (event) => event.key === "Escape" && (lightbox.hidden = true));
      const openCover = (src) => {
        lightbox.querySelector("img").src = src;
        lightbox.hidden = false;
      };

      const toast = document.querySelector(".toast");
      let toastTimer = 0;
      function say(text) {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
      }

      let players = [];
      function enable() {
        players = [
          ...[...document.querySelectorAll(".sized video")].map((video) => Player.enhanceVideo(video, { download })),
          ...[...document.querySelectorAll(".attachment audio")].map((audio) =>
            Player.enhanceAudio(audio, { download, cover: Covers.cover, openCover }),
          ),
        ];
      }
      function disable() {
        for (const player of players) player.destroy();
        players = [];
      }

      document.getElementById("enabled").addEventListener("change", (event) => {
        if (event.target.checked) {
          enable();
          say("Плеер включён");
        } else {
          disable();
          say("Стандартные элементы браузера");
        }
      });

      enable();
    </script>
  </body>
</html>
