<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Превью: «Участник с» — код клиента</title>
<!-- значок вкладки — его клиент ставит как значок Stoat (здесь заглушка) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23fff'/%3E%3Ctext x='8' y='12' font-size='10' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23111'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;550;600&display=swap" rel="stylesheet">
<style>
  /* переменные Material 3 for-web, тёмная тема */
  :root {
    --md-sys-color-surface: #2c2421;
    --md-sys-color-surface-container-high: #3a302d;
    --md-sys-color-surface-container-low: #251e1c;
    --md-sys-color-on-surface: #ede0dc;
    --md-sys-color-on-surface-variant: #c9b5af;
    --md-sys-color-primary: #ffb4a3;
    --md-sys-color-on-primary: #561f10;
    --md-sys-color-primary-container: #73342a;
    --md-sys-color-on-primary-container: #ffdad3;
    --md-sys-color-secondary-container: #5d4039;
    --gap-xs: 2px; --gap-sm: 4px; --gap-md: 8px; --gap-lg: 15px;
    --borderRadius-md: 12px; --borderRadius-lg: 16px; --borderRadius-xl: 28px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 32px 64px; background: #1d1715; color: var(--md-sys-color-on-surface);
    font-family: Inter, "Segoe UI", sans-serif; font-size: 14px;
  }
  h1 { font-size: 22px; font-weight: 550; margin: 0 0 4px; }
  .note { color: var(--md-sys-color-on-surface-variant); margin: 0 0 16px; max-width: 900px; line-height: 1.45; }
  label.toggle { display: inline-flex; gap: 8px; align-items: center; margin-bottom: 20px; cursor: pointer; }
  .caption { color: var(--md-sys-color-on-surface-variant); font-size: 12px; margin: 0 0 6px; }
  #floating { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  /* список серверов слева — отсюда клиент берёт значок сервера */
  .servers { position: fixed; left: -9999px; }

  /* разметка — как у for-web: Grid, ProfileCard (Panda), Text (span) */
  .usercard {
    width: 340px; height: 400px; overflow-y: auto; scrollbar-width: none;
    background: var(--md-sys-color-surface-container-high); border-radius: var(--borderRadius-xl);
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
  }
  .modal { width: 560px; background: var(--md-sys-color-surface); border-radius: var(--borderRadius-xl); padding: 8px; }
  .grid { display: grid; gap: var(--gap-md); padding: var(--gap-md); }
  .usercard .grid { grid-template-columns: repeat(2, 1fr); }
  .modal .grid { grid-template-columns: repeat(3, 1fr); }
  .w2 { grid-column: 1 / 3; }
  .w3 { grid-column: 1 / 4; }
  .banner {
    height: 120px; padding: var(--gap-lg); border-radius: var(--borderRadius-xl); color: #fff;
    display: flex; flex-direction: column; justify-content: end;
    background: linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.7)), linear-gradient(120deg, #7b3f2f, #3d4f7a 60%, #2b6b5e);
  }
  .who { display: flex; align-items: center; gap: var(--gap-lg); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffcfb8, #c46a4f 70%); }
  .names { display: flex; flex-direction: column; gap: 2px; line-height: 1rem; }
  .names i { font-style: normal; font-weight: 200; }
  .actions { display: flex; gap: var(--gap-md); }
  .btn { height: 40px; border-radius: 999px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); flex: 1; display: grid; place-items: center; font-weight: 500; }
  .ibtn { width: 40px; height: 40px; border-radius: 999px; background: var(--md-sys-color-secondary-container); }
  .card {
    position: relative; min-width: 0; height: 100%; width: 100%;
    background: var(--md-sys-color-surface-container-low); border-radius: var(--borderRadius-lg);
    padding: var(--gap-lg); display: flex; flex-direction: column; gap: var(--gap-sm);
  }
  .card.sq { overflow: hidden; aspect-ratio: 1 / 1; }
  .title { font-size: 1.375rem; line-height: 1.75rem; font-weight: 550; }
  .label { font-size: .875rem; line-height: 1.25rem; font-weight: 500; }
  .label > div { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .text { font-size: 1rem; line-height: 1.5rem; }
  .role { display: flex; align-items: center; }
  .role span { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .badge { width: 24px; height: 24px; border-radius: 6px; display: inline-block; margin-right: 8px; }
</style>
</head>
<body>
<h1>«Участник с» — код клиента</h1>
<p class="note">Здесь работает сам код клиента (emoji.js) на разметке профиля, как у Stoat. Переключатель — настройка
  «Исправление деталей интерфейса»: без неё видно, как сейчас. Значок Stoat — заглушка «S», в клиенте будет
  значок вкладки Stoat.</p>
<label class="toggle"><input type="checkbox" id="interface" checked> Исправление деталей интерфейса</label>

<div class="servers">
  <div aria-label="Русское сообщество Stoat"><div><a href="/server/01PREVIEW"><img alt=""
    src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234f6bd8'/%3E%3Cpath d='M3 11l3-4 2 3 2-2 3 3z' fill='%23fff'/%3E%3C/svg%3E"></a></div></div>
</div>

<div id="floating"></div>

<script>
const tile = (inner, cls = "card sq") => `<div class="${cls}">${inner}</div>`;
const banner = (w) => `<div class="banner ${w}"><div class="who"><div class="avatar"></div>
  <div class="names"><b>Арахнид</b><span>arachnid<i>#1234</i></span></div></div></div>`;
const actions = (w) => `<div class="actions ${w}"><div class="btn">Сообщение</div><div class="ibtn"></div><div class="ibtn"></div></div>`;
const roles = tile(`<span class="title">Роли</span><div>
  <div class="role"><span class="label">Модератор</span><i class="dot" style="background:#e6a23c"></i></div>
  <div class="role"><span class="label">Участник</span><i class="dot" style="background:#7c8bd6"></i></div></div>`);
const badges = tile(`<span class="title">Значки</span><div><i class="badge" style="background:#e9b44c"></i><i class="badge" style="background:#5fb4a2"></i></div>`);
const status = tile(`<span class="title">Статус</span><span class="text">Пишу клиент</span>`);
// ProfileJoined for-web: заголовок, «Stoat», дата, сервер, дата (формат L с MMM)
const joined = tile(`<span class="title">Присоединившиеся</span>
  <span class="label"><div>Stoat</div></span><span class="text">12.март.2023</span>
  <span class="label"><div>Русское сообщество Stoat</div></span><span class="text">05.янв..2024</span>`);
const bio = (w) => tile(`<span class="title">Информация</span><span class="text">Делаю настольный клиент для Stoat. Пишите в личку, если нашли ошибку.</span>`, `card ${w}`);

const portal = document.createElement("div");
portal.style.cssText = "display:contents";
portal.innerHTML = `
  <div><p class="caption">Карточка</p><div class="usercard"><div class="grid">
    ${banner("w2")}${actions("w2")}${roles}${badges}${status}${joined}${bio("w2")}
  </div></div></div>
  <div><p class="caption">Окно профиля</p><div class="modal"><div class="grid">
    ${banner("w3")}${actions("w3")}${roles}${status}${badges}${joined}${bio("w3")}
  </div></div></div>`;
document.getElementById("floating").append(portal);

// встроенный плагин, как его запускает клиент: тело функции с объектом plugin
window.__arachnidDesktop = {};
const listeners = [];
const plugin = {
  settings: { interface: true, emoji_picker: false },
  onSettingsChange: (callback) => listeners.push(callback),
};
document.getElementById("interface").addEventListener("change", (event) => {
  plugin.settings.interface = event.target.checked;
  for (const callback of listeners) callback();
});
fetch("/apps/desktop/src-tauri/src/emoji.js")
  .then((response) => response.text())
  .then((code) => {
    code = code.replace("__ARACHNID_EMOJI_MAPPING__", "[]").replace("__ARACHNID_EMOJI_CATEGORIES__", "{}");
    new Function("plugin", code)(plugin);
  });
</script>
</body>
</html>
