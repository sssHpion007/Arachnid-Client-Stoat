name: windows

# Быстрая сборка только под Windows: тот же одиночный файл
# ArachnidClient.exe, что в релизе (portable: данные рядом с ним). Без
# тегов, без релизов, без macOS/Linux — чтобы проверка изменений занимала
# минуты, а не полчаса.
#
# Тестовая сборка делается прямо из рабочей ветки (arena/…), без слияния в
# main: ветка отправляется на GitHub, когда нужна сборка для проверки.
on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

# новая отправка той же ветки отменяет недоделанную сборку
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: exe для windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-fast

      - name: Тесты приложения
        run: cargo test -p arachnid-client

      # как в release.yml: сборка Tauri CLI с возможностью portable
      - name: Сборка приложения
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: npx --yes "@tauri-apps/cli@2" build --no-bundle --features portable

      - name: ArachnidClient.exe
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/arachnid-client.exe "dist/ArachnidClient.exe"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: arachnid-client-windows-x86_64
          path: dist/ArachnidClient.exe
          if-no-files-found: error
          retention-days: 30

  # Собранный exe в настоящем WebView2: тестовая страница вместо stoat.chat
  # (apps/desktop/src-tauri/e2e) проверяет встроенный Twemoji (в том числе
  # под service worker, как у for-web), значение набора эмодзи по умолчанию в
  # хранилище for-web, шторку выбора набора и скачивание/удаление набора.
  e2e:
    name: проверка в WebView2
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: arachnid-client-windows-x86_64
          path: artifact

      - name: localforage для тестовой страницы
        run: npm install --no-save --no-package-lock --prefix apps/desktop/src-tauri/e2e localforage@1.10.0

      - name: Проверка
        shell: pwsh
        run: ./apps/desktop/src-tauri/e2e/run.ps1 -Exe "artifact/ArachnidClient.exe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: apps/desktop/src-tauri/e2e/logs
          if-no-files-found: ignore
          retention-days: 7
