name: windows

# Быстрая сборка только под Windows: нужен один архив, который можно
# распаковать и запустить. Без тегов, без релизов, без macOS/Linux —
# чтобы проверка изменений занимала минуты, а не полчаса.
#
# Тестовая сборка делается прямо из рабочей ветки (arena/…), без слияния в
# main: ветка отправляется на GitHub, когда нужна сборка для проверки.
on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

# новая отправка той же ветки отменяет недоделанную сборку
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: exe для windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-fast

      - name: Тесты приложения
        run: cargo test -p arachnid-client

      - name: Сборка приложения
        run: cargo build --release -p arachnid-client

      - name: Собрать папку и архив
        shell: bash
        run: |
          mkdir -p dist/Arachnid-Client
          cp target/release/arachnid-client.exe dist/Arachnid-Client/
          mkdir -p dist/Arachnid-Client/logs
          # свои темы (*.css) и плагины (*.js), см. docs/extensions.md
          mkdir -p dist/Arachnid-Client/themes dist/Arachnid-Client/plugins
          # config.toml рядом с exe включает portable-режим: вход и настройки
          # хранятся в этой же папке
          cp bootstrap/config.toml dist/Arachnid-Client/
          cp bootstrap/README.txt dist/Arachnid-Client/
          cd dist
          powershell -Command "Compress-Archive -Path Arachnid-Client -DestinationPath 'arachnid-client-windows-x86_64.zip' -Force"
          ls -la
          du -h arachnid-client-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: arachnid-client-windows-x86_64
          path: dist/arachnid-client-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
