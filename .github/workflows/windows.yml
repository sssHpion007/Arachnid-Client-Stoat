name: windows

# Быстрая сборка только под Windows: нужен один архив, который можно
# распаковать и запустить. Без тегов, без релизов, без macOS/Linux —
# чтобы проверка изменений занимала минуты, а не полчаса.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: exe для windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-fast

      - name: Тесты ядра
        run: cargo test -p stoat-core -p stoat-plugin-api

      - name: Сборка приложения
        run: cargo build --release -p arachnid-client

      - name: Собрать папку и архив
        shell: bash
        run: |
          mkdir -p dist/Arachnid-Client
          cp target/release/arachnid-client.exe dist/Arachnid-Client/
          mkdir -p dist/Arachnid-Client/cache dist/Arachnid-Client/plugins \
                   dist/Arachnid-Client/themes dist/Arachnid-Client/logs
          cp bootstrap/config.toml dist/Arachnid-Client/ || true
          cp bootstrap/README.txt dist/Arachnid-Client/ || true
          # интерфейс и эмодзи лежат внутри exe, но копия рядом не мешает
          cd dist
          powershell -Command "Compress-Archive -Path Arachnid-Client -DestinationPath 'arachnid-client-windows-x86_64.zip' -Force"
          ls -la
          du -h arachnid-client-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: arachnid-client-windows-x86_64
          path: dist/arachnid-client-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
