name: release

# Собирает клиент и раскладывает файлы, которые скачивает бутстрап:
#   * portable-архив (zip/tar.gz) — распаковал в папку и запустил .exe
#   * установщики (msi/nsis, deb/appimage, dmg)
# Запуск: тег v* или вручную из вкладки Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# нужно, чтобы tauri-action мог создать черновик релиза и залить установщики
permissions:
  contents: write

jobs:
  bootstrap:
    name: bootstrap-скрипты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка синтаксиса
        run: bash -n bootstrap/bootstrap.sh && chmod +x bootstrap/bootstrap.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: |
            bootstrap/bootstrap.sh
            bootstrap/bootstrap.ps1

  portable:
    name: portable (${{ matrix.asset }})
    # у приватного репозитория нет macOS-минут: такие джобы отменяются после
    # 15 минут ожидания раннера, поэтому выпуск от них не зависит
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: arachnid-client-windows-x86_64
            bin: target/release/arachnid-client.exe
            pack: zip
          - os: ubuntu-22.04
            asset: arachnid-client-linux-x86_64
            bin: target/release/arachnid-client
            pack: tar.gz
          - os: macos-latest
            asset: arachnid-client-macos-aarch64
            bin: target/release/arachnid-client
            pack: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-зависимости
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-${{ matrix.os }}

      - name: Тесты приложения
        run: cargo test -p arachnid-client

      - name: Сборка клиента
        run: cargo build --release -p arachnid-client

      - name: Собрать portable-архив
        shell: bash
        run: |
          mkdir -p dist/Arachnid-Client
          cp "${{ matrix.bin }}" dist/Arachnid-Client/
          mkdir -p dist/Arachnid-Client/logs
          mkdir -p dist/Arachnid-Client/themes dist/Arachnid-Client/plugins
          cp bootstrap/config.toml dist/Arachnid-Client/
          cp bootstrap/README.txt dist/Arachnid-Client/
          cd dist
          if [ "${{ matrix.pack }}" = "zip" ]; then
            (command -v 7z >/dev/null && 7z a -tzip "${{ matrix.asset }}.zip" Arachnid-Client) \
              || powershell -Command "Compress-Archive -Path Arachnid-Client -DestinationPath '${{ matrix.asset }}.zip'"
          else
            tar czf "${{ matrix.asset }}.tar.gz" Arachnid-Client
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  installers:
    name: установщики (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-зависимости
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-${{ matrix.os }}

      - name: Установщики (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Arachnid Client {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Установка

            **Самое простое** — portable-архив: распакуйте в любую папку и запустите
            `arachnid-client.exe`. Рядом с ним лежит `config.toml`: вход и настройки
            хранятся в этой же папке, её можно переносить.

            Либо установщик: `*-setup.exe` (NSIS) или `.msi`.

            Бутстрап (`bootstrap.sh` / `bootstrap.ps1`) сам скачает portable-архив
            и развернёт всё в отдельной папке.
          releaseDraft: true
          prerelease: false

  publish:
    name: приложить файлы к релизу
    needs: [bootstrap, portable, installers]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Загрузить всё в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # релиз обычно создаёт tauri-action из джобы установщиков; если он
          # не появился — создаём сами
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Arachnid Client ${GITHUB_REF_NAME}" \
              --notes "Настольный клиент Stoat: официальный веб-клиент в окне Tauri."

          # заливаем по одному файлу: отсутствие части артефактов
          # (например, macOS) не должно ломать выпуск
          for file in artifacts/bootstrap/*.sh artifacts/bootstrap/*.ps1 \
                      artifacts/*/*.zip artifacts/*/*.tar.gz; do
            [ -f "$file" ] || continue
            echo "загружаю $file"
            gh release upload "${GITHUB_REF_NAME}" "$file" --clobber
          done
