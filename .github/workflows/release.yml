name: release

# Выпуск для Windows, Linux и macOS:
#   * установщики — Arachnid-Client-Setup.exe (NSIS), .deb, .rpm, .dmg;
#   * одиночные файлы (portable: данные — в папке рядом с ними) —
#     «Arachnid Client.exe», «Arachnid Client.AppImage», «Arachnid Client.app.zip»
#     (приложение macOS — это папка .app, файлом его можно выложить только так).
#
# Тег v* — сборка и релиз с этими файлами. Отправка рабочей ветки, в которой
# меняется сборка (этот файл, tauri.conf.json, Cargo.toml), — только сборка,
# чтобы проверить её до тега; файлы лежат в артефактах запуска.
on:
  push:
    tags: ["v*"]
    branches: ["arena/**"]
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/Info.plist
      - apps/desktop/src-tauri/Cargo.toml
      - Cargo.toml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # Tauri CLI той же второй версии, что и крейты tauri
  TAURI_CLI: "@tauri-apps/cli@2"

jobs:
  build:
    name: сборка (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
            # один файл и для Apple Silicon, и для Intel
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-зависимости
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Тесты приложения
        run: cargo test -p arachnid-client

      # Сначала установщики обычной сборкой, затем одиночный файл сборкой с
      # возможностью portable (данные рядом с файлом). Вторая сборка
      # перекомпилирует только сам клиент.
      - name: Установщики и одиночный файл
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          cd apps/desktop/src-tauri
          tauri() { npx --yes "$TAURI_CLI" build "$@"; }
          # pick <куда> <собранный файл>: шаблон должен дать ровно один файл
          pick() {
            if [ "$#" -ne 2 ] || [ ! -e "$2" ]; then
              echo "::error::не найден файл для $(basename "$1")"
              exit 1
            fi
            cp "$2" "$1"
          }
          target="$GITHUB_WORKSPACE/target"
          case "$RUNNER_OS" in
            Windows)
              tauri --bundles nsis
              pick "$out/Arachnid-Client-Setup.exe" "$target"/release/bundle/nsis/*-setup.exe
              tauri --no-bundle --features portable
              pick "$out/Arachnid Client.exe" "$target/release/arachnid-client.exe"
              ;;
            Linux)
              tauri --bundles deb,rpm
              pick "$out/Arachnid-Client-Setup.deb" "$target"/release/bundle/deb/*.deb
              pick "$out/Arachnid-Client-Setup.rpm" "$target"/release/bundle/rpm/*.rpm
              tauri --bundles appimage --features portable
              pick "$out/Arachnid Client.AppImage" "$target"/release/bundle/appimage/*.AppImage
              chmod +x "$out/Arachnid Client.AppImage"
              ;;
            macOS)
              bundle="$target/universal-apple-darwin/release/bundle"
              tauri --target universal-apple-darwin --bundles dmg
              pick "$out/Arachnid-Client-Setup.dmg" "$bundle"/dmg/*.dmg
              tauri --target universal-apple-darwin --bundles app --features portable
              app="$bundle/macos/Arachnid Client.app"
              [ -d "$app" ] || { echo "::error::не найден Arachnid Client.app"; exit 1; }
              # ditto сохраняет ссылки и подпись внутри пакета
              ditto -c -k --sequesterRsrc --keepParent "$app" "$out/Arachnid Client.app.zip"
              ;;
          esac
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: релиз
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Релиз с файлами
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la dist
          tag="$GITHUB_REF_NAME"
          # черновик, пока не загружены все файлы: релиз не виден недоделанным
          gh release create "$tag" --draft --verify-tag \
            --title "Arachnid Client ${tag#v}" --notes-file .github/release-notes.md
          for file in dist/*; do
            # пробел в имени GitHub меняет на точку; подпись оставляет имя как есть
            gh release upload "$tag" "$file#$(basename "$file")" --clobber
          done
          gh release edit "$tag" --draft=false --latest
