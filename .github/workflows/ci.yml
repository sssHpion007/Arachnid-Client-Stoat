name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: ядро и плагины
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: .github/scripts/annotate.sh cargo fmt --all -- --check

      # ядро не тянет GTK/WebKit, поэтому проверяется без системных пакетов
      - name: clippy
        run: .github/scripts/annotate.sh cargo clippy -p stoat-core -p stoat-plugin-api --all-targets -- -D warnings

      - name: test
        run: .github/scripts/annotate.sh cargo test -p stoat-core -p stoat-plugin-api

  desktop:
    name: приложение (типы и тесты)
    # Главная цель — Windows; там WebView2 уже есть, и не нужны системные
    # пакеты GTK/WebKit, установка которых через apt зависала на раннерах Linux.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      # ловит ошибки в мосте и командах ещё до сборки установщика
      - name: clippy приложения
        run: .github/scripts/annotate.sh cargo clippy -p arachnid-client --all-targets -- -D warnings

      - name: тесты приложения
        run: .github/scripts/annotate.sh cargo test -p arachnid-client
