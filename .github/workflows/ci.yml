name: ci

# рабочие ветки (arena/…) проверяются так же, как main: форматирование и
# clippy ловят ошибки до слияния
on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: fmt
        run: .github/scripts/annotate.sh cargo fmt --all -- --check

  desktop:
    name: приложение (типы и тесты)
    # Главная цель — Windows; там WebView2 уже есть, и не нужны системные
    # пакеты GTK/WebKit, установка которых через apt зависала на раннерах Linux.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      # ловит ошибки в мосте и командах ещё до сборки установщика
      - name: clippy приложения
        run: .github/scripts/annotate.sh cargo clippy -p arachnid-client --all-targets -- -D warnings

      - name: тесты приложения
        run: .github/scripts/annotate.sh cargo test -p arachnid-client
