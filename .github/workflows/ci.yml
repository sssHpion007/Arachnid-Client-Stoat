name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      # приложение (tauri) тянет GTK/WebKit, поэтому проверяем только крейты ядра
      - name: clippy
        run: cargo clippy -p stoat-core -p stoat-plugin-api --all-targets -- -D warnings

      - name: test
        run: cargo test -p stoat-core -p stoat-plugin-api
